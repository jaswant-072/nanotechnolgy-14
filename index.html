<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Component - Practicum No. 14</title>
    <style>
        /* --- CSS Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 500px;
            max-width: 90%;
            overflow: hidden;
            padding: 2rem;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: #777;
            font-size: 0.9rem;
        }

        .score-display {
            font-weight: bold;
            color: #333;
        }

        .progress-bar-container {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50; /* Green Progress */
            width: 0%;
            transition: width 0.3s ease-in-out;
        }

        .quiz-body h2 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: #333;
            line-height: 1.4;
        }

        .option-list {
            list-style-type: none;
            margin-bottom: 2rem;
        }

        .option-list li {
            font-size: 1.1rem;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .option-list li:hover {
            background-color: #f0f0f0;
        }

        .option-list input[type="radio"] {
            margin-right: 1rem;
            transform: scale(1.2);
            cursor: pointer;
        }

        .option-list label {
            cursor: pointer;
            flex-grow: 1;
        }

        button#submit {
            background-color: #4caf50;
            color: #fff;
            border: none;
            display: block;
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#submit:hover {
            background-color: #43a047;
        }

        button#submit:active {
            transform: scale(0.98);
        }

        .results-container {
            text-align: center;
            padding: 2rem;
        }

        .results-container h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #333;
        }

        .results-container p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .results-container button {
            background-color: #f44336; /* Red color for play again */
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-header">
            <div id="progress-text">Question 1 / 0</div>
            <div class="score-display">Score: <span id="score">0</span></div>
        </div>
        
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>

        <div id="quiz" class="quiz-body">
            <h2 id="question">Loading question...</h2>
            
            <ul class="option-list">
                <li>
                    <input type="radio" name="answer" id="a" class="answer">
                    <label for="a" id="a_text">Option A</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="b" class="answer">
                    <label for="b" id="b_text">Option B</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="c" class="answer">
                    <label for="c" id="c_text">Option C</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="d" class="answer">
                    <label for="d" id="d_text">Option D</label>
                </li>
            </ul>
        </div>

        <button id="submit">Next Question</button>
    </div>

    <script>
        // --- JavaScript Logic ---

        // --- 1. Quiz Data ---
        const quizData = [
            {
                question: "What does HTML stand for?",
                a: "Hyperlinks and Text Markup Language",
                b: "HyperText Markup Language",
                c: "Home Tool Markup Language",
                d: "Hyperlinking Text Marking Language",
                correct: "b",
            },
            {
                question: "What does CSS stand for?",
                a: "Colorful Style Sheets",
                b: "Computer Style Sheets",
                c: "Cascading Style Sheets",
                d: "Creative Style Sheets",
                correct: "c",
            },
            {
                question: "Which HTML element defines the title of a document?",
                a: "&lt;meta&gt;",
                b: "&lt;header&gt;",
                c: "&lt;title&gt;",
                d: "&lt;head&gt;",
                correct: "c",
            },
            {
                question: "Which property is used to change the background color in CSS?",
                a: "color",
                b: "background-color",
                c: "bgcolor",
                d: "background-image",
                correct: "b",
            },
            {
                question: "What is the correct JavaScript syntax to write 'Hello World' in an alert box?",
                a: "alertBox('Hello World');",
                b: "msg('Hello World');",
                c: "msgBox('Hello World');",
                d: "alert('Hello World');",
                correct: "d",
            }
        ];

        // --- 2. DOM Element Selection ---
        const quizContainer = document.querySelector('.quiz-container');
        const quizEl = document.getElementById('quiz');
        const questionEl = document.getElementById('question');
        const a_text = document.getElementById('a_text');
        const b_text = document.getElementById('b_text');
        const c_text = document.getElementById('c_text');
        const d_text = document.getElementById('d_text');
        const submitBtn = document.getElementById('submit');
        const scoreEl = document.getElementById('score');
        const progressTextEl = document.getElementById('progress-text');
        const progressBarEl = document.getElementById('progress-bar');

        const answerEls = document.querySelectorAll('.answer');

        // --- 3. Application State ---
        let currentQuiz = 0;
        let score = 0;

        // --- 4. Initialization ---
        loadQuiz();

        // --- 5. Core Functions ---

        function loadQuiz() {
            deselectAnswers();

            const currentQuizData = quizData[currentQuiz];

            questionEl.innerHTML = currentQuizData.question;
            a_text.innerText = currentQuizData.a;
            b_text.innerText = currentQuizData.b;
            c_text.innerText = currentQuizData.c;
            d_text.innerText = currentQuizData.d;

            updateProgress();
        }

        function deselectAnswers() {
            answerEls.forEach(answerEl => answerEl.checked = false);
        }

        function getSelected() {
            let answer = undefined;

            answerEls.forEach(answerEl => {
                if(answerEl.checked) {
                    answer = answerEl.id;
                }
            });

            return answer;
        }

        function updateProgress() {
            const progressPercent = Math.round(((currentQuiz + 1) / quizData.length) * 100);
            
            progressTextEl.innerText = `Question ${currentQuiz + 1} / ${quizData.length}`;
            progressBarEl.style.width = `${progressPercent}%`;
        }


        // --- 6. Event Listener ---

        submitBtn.addEventListener('click', () => {
            const answer = getSelected();

            if(answer) {
                if(answer === quizData[currentQuiz].correct) {
                    score++;
                    scoreEl.innerText = score;
                }

                currentQuiz++;

                if(currentQuiz < quizData.length) {
                    loadQuiz();
                } else {
                    // Display Results
                    quizContainer.innerHTML = `
                        <div class="results-container">
                            <h2>Quiz Completed!</h2>
                            <p>You answered ${score}/${quizData.length} questions correctly.</p>
                            <button onclick="location.reload()">Play Again</button>
                        </div>
                    `;
                }
            } else {
                alert("Please select an answer before proceeding.");
            }
        });

    </script>
</body>
</html>
